<script>
var awTheme = new URLSearchParams(location.search).get('theme') === 'dark' ? 'dark' : 'classic';
window.__AWESOME__ = {"cdn":"/node_modules/vditor","mode":"wysiwyg","showToolbar":true,"contextMenu":true,"taskListSort":true,"theme":awTheme};
window.__INITIAL__ = "# Awesome Markdown\n\n这是一个**所见即所得**的 Markdown 编辑器。\n\n- 直接在渲染结果上编辑\n- 右键插入段落、引用、表格\n\n> 引用块示例\n\n| 名字 | 说明 |\n| --- | --- |\n| 表格 | 已渲染 |\n\n```js\nconst hello = \"world\";\n```\n\n待办示例（勾选后会自动沉到列表末尾）：\n\n- [ ] 设计插件架构\n- [ ] 实现渲染层\n- [ ] 写测试\n";
window.__posted = [];
window.acquireVsCodeApi = function () {
	return {
		postMessage: function (msg) {
			window.__posted.push(msg);
			if (msg.type === 'ready') {
				setTimeout(function () {
					window.postMessage({ type: 'init', value: window.__INITIAL__, theme: awTheme }, '*');
				}, 0);
			}
		},
		setState: function () {},
		getState: function () { return {}; }
	};
};
